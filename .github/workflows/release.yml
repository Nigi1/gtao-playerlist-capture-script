name: Build and Release EXE
on:
    push:
        tags:
            - "v*.*.*"
    workflow_dispatch:

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Compile AHKv2 script to EXE
              uses: benmusson/ahk2exe-action@v1
              with:
                  in: .\PlayerlistCapture.ahk
                  out: .\build\PlayerlistCapture-${{ github.ref_name }}.exe
                  target: x64
                  compression: upx
                  ahk-tag: latest
                  github-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Package EXE and config into a zip
              run: |
                  mkdir release-package
                  copy build\PlayerlistCapture-${{ github.ref_name }}.exe release-package\
                  copy config.ini release-package\
                  Compress-Archive -Path release-package\* -DestinationPath PlayerlistCapture-${{ github.ref_name }}.zip
              shell: pwsh

            - name: Create GitHub Release with the zip attached
              uses: softprops/action-gh-release@v2
              with:
                  name: Playerlist Capture ${{ github.ref_name }}
                  files: PlayerlistCapture-${{ github.ref_name }}.zip
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
